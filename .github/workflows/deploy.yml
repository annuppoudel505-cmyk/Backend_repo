name: build and deploy to ghcr

on:
  push:
    branches:
      - dev

permissions:
        contents: read
        packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CI_TOKEN }}

       
      - name: Build docker image and push to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile.multi
          push: true
          tags: ghcr.io/annuppoudel505-cmyk/backend_repo:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with: 
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Logging into GHCR..."

            echo "${{ secrets.CI_TOKEN }}" | docker login ghcr.io -u $GHCR_USERNAME --password-stdin
            
            echo "Pulling latest image..."
            docker pull ghcr.io/annuppoudel505-cmyk/backend_repo:latest
            
            echo "Stopping old container..."
            docker stop backend || true
            docker rm backend || true

            echo "Starting new container..."
            docker run -d --name backend -p 80:8080 ghcr.io/annuppoudel505-cmyk/backend_repo:latest



